[project]
name = "enterprise-fastapi"
version = "1.0.0"
description = "Enterprise FastAPI project with SQLite fallback"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Enterprise Team", email = "team@example.com" }]
keywords = ["fastapi", "async", "enterprise", "sqlite", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "aiocache>=0.12.0",
    "fastapi-cache2>=0.2.0",
    "slowapi",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "dependency-injector>=4.41.0",
    "fastapi-versionizer>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pytest-cov>=4.1.0",
    "psycopg2-binary>=2.9.11",
]

[project.scripts]
manage = "app.cli:cli"
enterprise-fastapi = "app.cli:cli"

[project.urls]
Homepage = "https://github.com/example/enterprise-fastapi"
Documentation = "https://github.com/example/enterprise-fastapi#readme"
Repository = "https://github.com/example/enterprise-fastapi"
Issues = "https://github.com/example/enterprise-fastapi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest]
minversion = "8.0"
addopts = ["-ra", "-q"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration test",
]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source_pkgs = ["app"]
branch = true
parallel = true
omit = [
    "*/.venv/*",
    "*/tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
