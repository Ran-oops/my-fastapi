target-version = "py313"
line-length = 120

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "alembic/versions",
    "build",
    "dist",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "PTH",  # pathlib best practice
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit
]

ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "S101",  # assert used in tests
    "S105",  # hardcoded password strings (acceptable for defaults)
    "ARG004", # unused function argument (placeholder params)
]

[lint.per-file-ignores]
"app/cli/*" = ["E402", "ARG"]
"app/services/*" = ["ARG"]
"app/core/*" = ["S105"]
"app/schemas/*" = ["S105"]
"tests/*" = ["S101", "ARG"]
"alembic/*" = ["ARG"]

[lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2
